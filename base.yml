# Shared spec: the Captain app on its own. Included by project.yml and project-preview.yml.
name: Captain
options:
  bundleIdPrefix: com.garand
  deploymentTarget:
    macOS: "14.0"
  developmentLanguage: en
  createIntermediateGroups: true

settings:
  base:
    DEVELOPMENT_TEAM: ${CAPTAIN_TEAM_ID}
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_HARDENED_RUNTIME: YES
    DEAD_CODE_STRIPPING: YES

targets:
  Captain:
    type: application
    platform: macOS
    sources:
      - path: Captain
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.garand.captain
        PRODUCT_NAME: Captain
    info:
      path: Captain/Info.plist
      properties:
        CFBundleName: Captain
        CFBundleDisplayName: Captain
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        LSApplicationCategoryType: public.app-category.video
        NSCameraUsageDescription: Captain watches your webcams to work out which display you are looking at.
    entitlements:
      path: Captain/Captain.entitlements
      properties:
        com.apple.security.device.camera: true
